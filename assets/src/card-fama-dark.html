<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Nunito Sans",sans-serif}
.mono{font-family:"JetBrains Mono",monospace}

body{background:#000000}
.card{width:896px;height:188px;padding:26px 36px;position:relative;border-top:1px solid #2E2E2E;display:flex;gap:28px}
.tile{flex:none;width:96px;height:96px;margin-top:20px;background:#FFFFFF;color:#000000;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center}
.main{flex:1;display:flex;flex-direction:column}
.row1{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-size:33px;font-weight:800;color:#FFFFFF;letter-spacing:-.5px}
.pill{font-size:19px;font-weight:800;padding:7px 16px;background:#FFCE00;color:#000000}
.desc{font-size:22.5px;color:#BFBFBF;margin-top:7px;line-height:1.3;font-weight:400}
.row3{margin-top:auto;display:flex;justify-content:space-between;align-items:center}
.stack{font-size:19.5px;color:#8A8A8A}
.arr{color:#FF4713;font-size:26px;font-weight:800}
</style></head><body><div class="card">
<div class="tile">F</div>
<div class="main"><div class="row1"><div class="name">FAMA</div><div class="pill">In development</div></div>
<div class="desc">Judicial-disposal real-estate data infrastructure (China). In development; not yet offered.</div>
<div class="row3"><div class="stack mono">Python &middot; PostgreSQL &middot; Playwright</div><div class="arr">&rarr;</div></div>
</div></body></html>
