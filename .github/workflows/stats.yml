name: self-hosted stats

# Replaces the third-party github-readme-stats cards (recurring 503s) with
# self-generated SVGs committed into this repo. Runs daily + on demand.
on:
  schedule:
    - cron: "17 3 * * *"   # ~23:17 EDT / 03:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVGs
        env:
          GH_USER: HUIIIM
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SVG_OUT: ./assets
        run: python3 .github/workflows/scripts/generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --cached --quiet && echo "no changes" || \
            git commit -m "chore: refresh self-hosted stats SVG [skip ci]" && \
            git push
